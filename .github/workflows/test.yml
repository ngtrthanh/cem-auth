name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: auth, POSTGRES_PASSWORD: auth, POSTGRES_DB: cem_auth_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      CEM_AUTH_TEST_DB: postgresql+psycopg://auth:auth@127.0.0.1:5432/cem_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
